[project]
name = "linacre-wallpaper-backend"
version = "1.1.0"
description = "Real-time system monitoring backend for Lively Wallpaper"
authors = [{ name = "David Linacre", email = "david@linacre.site" }]
license = { text = "MIT" }
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psutil>=7.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "nvidia-ml-py",
]

[project.urls]
Homepage = "https://www.linacre.site"
Repository = "https://github.com/LIN4CRE/linacre-wallpaper"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
